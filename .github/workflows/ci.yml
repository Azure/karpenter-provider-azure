name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ci:
    runs-on: karpenter-ci-1es-pool
    env:
      # Keep the default version aligned with hack/toolchain.sh and
      # .github/actions/install-deps/action.yaml.
      K8S_VERSION: "1.34.x"
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        disable-telemetry: true
        egress-policy: block
        allowed-endpoints: >
          api.github.com:443
          github.com:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          proxy.golang.org:443
          golang.org:443
          raw.githubusercontent.com:443
          storage.googleapis.com:443
          sum.golang.org:443
          go.dev:443
          dl.google.com:443
          vuln.go.dev:443
          aquasecurity.github.io:443
          mirror.gcr.io:443
          azure.archive.ubuntu.com:80
          packages.microsoft.com:443
          esm.ubuntu.com:443
          aka.ms:443
          download.visualstudio.microsoft.com:443
          download.microsoft.com:443

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ./.github/actions/install-deps
      with:
        k8sVersion: ${{ env.K8S_VERSION }}
    - run: make ci-non-test
