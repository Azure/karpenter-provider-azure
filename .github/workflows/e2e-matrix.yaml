name: E2EMatrix
on:
  workflow_call:
    inputs:
      git_ref:
        type: string
      location:
        type: string
        description: "the azure location to run the e2e test in"
        default: "eastus"
      provision_mode:
        type: string
        description: "the karpenter provisioning mode to run the e2e test in"
        default: "aksscriptless"
      k8s_version:
        type: string
        description: "the kubernetes version to use (e.g., 1.31). If empty, uses AKS default."
      azure_vm_size:
        type: string
        description: "the azure vm size to use for the e2e test (set to empty string to allow AKS to default)"
        default: "Standard_D4ds_v5"  # We have more quota for this VM size so force it to avoid quota errors
    secrets:
      E2E_CLIENT_ID_TEST:
        required: true
      E2E_SUBSCRIPTION_ID_TEST:
        required: true

permissions:
  contents: read

jobs:
  e2e:
    name: ${{ matrix.source.name }} / ${{ matrix.case.provision_mode }} / ${{ matrix.case.suite }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        case:
          - {suite: Utilization, provision_mode: aksscriptless}
          - {suite: Consolidation, provision_mode: aksscriptless}
          - {suite: CapacityBuffer, provision_mode: aksmachineapi}
          - {suite: Utilization, provision_mode: aksmachineapi}
          - {suite: Consolidation, provision_mode: aksmachineapi}
          - {suite: Drift, provision_mode: aksmachineapi}
          - {suite: Machine, provision_mode: aksmachineapi}
          - {suite: Integration, provision_mode: aksmachineapi}
        source:
          - {name: main, git_ref: 298f6f998fa77bb7e64d51e78913ff8f33f8b857}
          - {name: fixed, git_ref: 8f428c7c015d430a24431f6b5edea29f5511f3ea}
    permissions:
      contents: read
      statuses: write
    uses: ./.github/workflows/e2e.yaml
    with:
      git_ref: ${{ matrix.source.git_ref }}
      suite: ${{ matrix.case.suite }}
      location: ${{ inputs.location }}
      provision_mode: ${{ matrix.case.provision_mode }}
      k8s_version: ${{ inputs.k8s_version }}
      azure_vm_size: ${{ inputs.azure_vm_size }}
    secrets:
      E2E_CLIENT_ID_TEST: ${{ secrets.E2E_CLIENT_ID_TEST }}
      E2E_SUBSCRIPTION_ID_TEST: ${{ secrets.E2E_SUBSCRIPTION_ID_TEST }}
