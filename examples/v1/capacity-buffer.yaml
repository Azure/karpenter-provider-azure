# CapacityBuffer is alpha and must be enabled with
# settings.featureGates.capacityBuffer=true in the Karpenter Helm chart.
---
apiVersion: karpenter.azure.com/v1beta1
kind: AKSNodeClass
metadata:
  name: capacity-buffer
spec:
  imageFamily: Ubuntu
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: capacity-buffer
spec:
  limits:
    cpu: "4"
    memory: 8Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
  template:
    metadata:
      labels:
        capacity-buffer.example/enabled: "true"
        kubernetes.azure.com/ebpf-dataplane: cilium
    spec:
      nodeClassRef:
        group: karpenter.azure.com
        kind: AKSNodeClass
        name: capacity-buffer
      startupTaints:
        - key: node.cilium.io/agent-not-ready
          effect: NoExecute
          value: "true"
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: karpenter.azure.com/sku-family
          operator: In
          values: ["D"]
---
apiVersion: v1
kind: PodTemplate
metadata:
  name: general-purpose-buffer
  namespace: default
template:
  spec:
    containers:
      - name: workload
        image: mcr.microsoft.com/oss/kubernetes/pause:3.6
        resources:
          requests:
            cpu: "1"
            memory: 1Gi
    nodeSelector:
      capacity-buffer.example/enabled: "true"
      kubernetes.io/os: linux
---
apiVersion: autoscaling.x-k8s.io/v1beta1
kind: CapacityBuffer
metadata:
  name: general-purpose-buffer
  namespace: default
spec:
  provisioningStrategy: buffer.x-k8s.io/active-capacity
  podTemplateRef:
    name: general-purpose-buffer
  replicas: 2
  limits:
    cpu: "2"
    memory: 2Gi
